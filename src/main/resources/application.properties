spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/vehicledb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# Comma-separated list of origins allowed to make credentialed CORS requests.
# Native mobile apps send no Origin header and are unaffected; only browser
# (Flutter web) clients need their origin listed here.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://vehiclebackend.duckdns.org}

# User seeding — accounts are only created when a password is supplied (no hardcoded defaults).
seed.admin.username=${SEED_ADMIN_USERNAME:admin}
seed.admin.password=${SEED_ADMIN_PASSWORD:}
seed.demo.username=${SEED_DEMO_USERNAME:demo}
seed.demo.password=${SEED_DEMO_PASSWORD:}

server.port=${PORT:8080}
server.address=0.0.0.0

# Email / password-reset. Mail is optional: with no MAIL_HOST set the app still
# boots and "Passwort vergessen" logs the reset link instead of sending it.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@vehiclebackend.duckdns.org}
# Public web-app URL used to build the reset link (…/?reset=<token>).
app.frontend-url=${APP_FRONTEND_URL:https://vehiclebackend.duckdns.org}
app.password-reset.ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:60}

# Honor X-Forwarded-Proto/Host from the reverse proxy (Caddy). Without this,
# Spring sees requests as http://<container>:8080 and treats same-origin
# browser requests (Origin: https://<public-host>) as cross-origin -> 403.
server.forward-headers-strategy=framework
