# Backend-only stack: MySQL + Spring Boot app, no Caddy/TLS.
# Publishes the app on host port 8080 (HTTP, plain).
#
#   docker compose -f docker-compose.backend.yml up -d --build
#
# Reuses the same db_data volume name as docker-compose.yml so data is shared.
services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_DATABASE: vehicledb
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  app:
    build: .
    ports:
      - "8080:8080"          # published to the host (vs. expose: in the full stack)
    environment:
      DB_URL: jdbc:mysql://db:3306/vehicledb
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    depends_on:
      - db
    restart: always

volumes:
  db_data:
