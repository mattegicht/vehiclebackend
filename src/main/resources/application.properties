spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/vehicledb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# User seeding — accounts are only created when a password is supplied (no hardcoded defaults).
seed.admin.username=${SEED_ADMIN_USERNAME:admin}
seed.admin.password=${SEED_ADMIN_PASSWORD:}
seed.demo.username=${SEED_DEMO_USERNAME:demo}
seed.demo.password=${SEED_DEMO_PASSWORD:}

server.port=${PORT:8080}
server.address=0.0.0.0
